[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# 与验证载荷保持一致的稳定编译器版本（Monskill 验证 API 要求如实上报 compilerVersion）。
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# forge-std 由测试与部署脚本引用，首次使用前执行：
#   forge install --no-git foundry-rs/forge-std
remappings = ["forge-std/=lib/forge-std/src/"]
