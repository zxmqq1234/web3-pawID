<?xml version="1.0" encoding="UTF-8"?>
<!-- 数字形象 像素风 猫：16x16像素网格猫头，本次项目原创矢量演示资源 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pixel cat avatar" shape-rendering="crispEdges">
  <title>数字形象 像素宠物 猫</title>
  <rect width="512" height="512" rx="64" fill="#1E2430"/>
  <g>
    <!-- 背景像素星点 -->
    <rect x="48" y="64" width="16" height="16" fill="#7765F5"/>
    <rect x="448" y="64" width="16" height="16" fill="#7765F5"/>
    <rect x="48" y="416" width="16" height="16" fill="#3FA46A"/>
    <rect x="448" y="416" width="16" height="16" fill="#3FA46A"/>
    <rect x="96" y="96" width="16" height="16" fill="#FFD66B"/>
    <rect x="400" y="96" width="16" height="16" fill="#FFD66B"/>
  </g>
  <!-- 猫头像素主体 every unit 32px, origin 96,96 -->
  <g>
    <rect x="96" y="96" width="64" height="64" fill="#F5A54B"/>
    <rect x="352" y="96" width="64" height="64" fill="#F5A54B"/>
    <rect x="112" y="112" width="32" height="32" fill="#FF9EB0"/>
    <rect x="368" y="112" width="32" height="32" fill="#FF9EB0"/>
    <rect x="160" y="160" width="192" height="192" fill="#F8B25C"/>
    <rect x="128" y="192" width="32" height="128" fill="#F8B25C"/>
    <rect x="352" y="192" width="32" height="128" fill="#F8B25C"/>
    <rect x="160" y="352" width="192" height="32" fill="#F8B25C"/>
    <!-- 橘斑像素 -->
    <rect x="160" y="160" width="64" height="32" fill="#E8933C"/>
    <rect x="288" y="160" width="64" height="32" fill="#E8933C"/>
    <!-- 白嘴像素 -->
    <rect x="192" y="320" width="128" height="64" fill="#FFFFFF"/>
    <!-- 眼白像素 -->
    <rect x="176" y="224" width="64" height="64" fill="#FFFFFF"/>
    <rect x="272" y="224" width="64" height="64" fill="#FFFFFF"/>
    <!-- 瞳孔像素 -->
    <rect x="192" y="240" width="32" height="48" fill="#3FA46A"/>
    <rect x="288" y="240" width="32" height="48" fill="#3FA46A"/>
    <rect x="200" y="248" width="16" height="32" fill="#14241C"/>
    <rect x="296" y="248" width="16" height="32" fill="#14241C"/>
    <rect x="192" y="240" width="16" height="16" fill="#FFFFFF"/>
    <rect x="288" y="240" width="16" height="16" fill="#FFFFFF"/>
    <!-- 鼻子像素 -->
    <rect x="240" y="320" width="32" height="16" fill="#E86A7A"/>
    <rect x="248" y="336" width="16" height="16" fill="#8A5A3B"/>
    <rect x="224" y="352" width="16" height="16" fill="#8A5A3B"/>
    <rect x="272" y="352" width="16" height="16" fill="#8A5A3B"/>
  </g>
  <!-- 底部像素标签 -->
  <rect x="176" y="416" width="160" height="40" fill="#7765F5"/>
  <rect x="192" y="428" width="16" height="16" fill="#FFFFFF"/>
  <rect x="216" y="428" width="16" height="16" fill="#7DF0C0"/>
  <rect x="240" y="428" width="16" height="16" fill="#FFD66B"/>
  <rect x="264" y="428" width="16" height="16" fill="#FF9EB0"/>
  <rect x="288" y="428" width="16" height="16" fill="#FFFFFF"/>
</svg>
