  <circle cx="180" cy="420" r="26" fill="#9C6A45"/>
  <circle cx="332" cy="420" r="26" fill="#9C6A45"/>
  <circle cx="216" cy="442" r="24" fill="#7A4C30"/>
  <circle cx="296" cy="442" r="24" fill="#7A4C30"/>
  <ellipse cx="256" cy="440" rx="52" ry="42" fill="#C79B76"/>
