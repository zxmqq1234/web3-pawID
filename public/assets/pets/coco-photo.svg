  <path d="M168 360 Q256 404 344 360 L336 384 Q256 424 176 384 Z" fill="#7765F5"/>
  <circle cx="256" cy="406" r="14" fill="#FFD66B" stroke="#D9A83C" stroke-width="3"/>
