  <circle cx="150" cy="220" r="30" fill="#8A5A3B"/>
  <circle cx="362" cy="220" r="30" fill="#8A5A3B"/>
  <circle cx="170" cy="150" r="32" fill="#9C6A45"/>
  <circle cx="342" cy="150" r="32" fill="#9C6A45"/>
  <circle cx="216" cy="112" r="34" fill="#8A5A3B"/>
  <circle cx="296" cy="112" r="34" fill="#8A5A3B"/>
  <circle cx="256" cy="104" r="30" fill="#9C6A45"/>
